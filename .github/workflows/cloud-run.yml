name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: tricktionary-api
  REGION: ${{ vars.GCP_REGION }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        project_id: ${{ vars.GCP_PROJECT_ID }}

    # Setup gcloud CLI
    - uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}

    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - name: Authorize Docker push
      run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

    # Build the Docker image
    - name: Build
      run: |-
        docker build \
          --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/$SERVICE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
          .

    # Push the Docker image to Google Container Registry
    - name: Publish
      run: |-
        docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/$SERVICE:$GITHUB_SHA"

    # Ahead of the Cloud Run deploy, so a revision never goes live expecting an
    # index that is not there. firebase-tools picks up the credentials
    # google-github-actions/auth wrote, so this needs no key of its own.
    #
    # No --force: it deletes indexes firestore.indexes.json does not name. The
    # command also returns once index builds are accepted rather than finished,
    # which matters when the database is new.
    - name: Deploy Firestore rules and indexes
      run: npx firebase-tools@15.30.2 deploy --only firestore:indexes,firestore:rules --project "$PROJECT_ID"

    # Image only. Everything else about the service — service account, scaling,
    # CPU, env vars — is Terraform's, and passing any of it here would fight it.
    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: ${{ env.SERVICE }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
        region: ${{ env.REGION }}

    - name: Show Output
      run: echo ${{ steps.deploy.outputs.url }}

  sentry-release:
    name: Create Sentry release
    runs-on: ubuntu-latest
    environment: production
    needs: setup-build-publish-deploy

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - run: npm ci --prefer-offline
    - run: npm run codegen
    - run: npm run build

    - name: Create Sentry release
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      with:
        environment: production
        sourcemaps: ./dist
        version_prefix: tricktionary-api@
