overwrite: true
schema:
  - src/schema.ts
config:
  scalars:
    Timestamp: Timestamp
generates:
  graphql.schema.json:
    plugins:
      - "introspection"
  src/generated/graphql.ts:
    config:
      useIndexSignature: true
      avoidOptionals: false
      contextType: ApolloContext
      mappers:
        User: ../store/schema.js#UserDoc
        Trick: ../store/schema.js#TrickDoc
        TrickLevel: ../store/schema.js#TrickLevelDoc
        TrickVideoUpload: ../store/schema.js#TrickVideoUploadDoc
        Ruleset: ../store/schema.js#RulesetDoc
        Language: ../store/schema.js#LanguageDoc
        TrickCompletion: ../store/schema.js#TrickCompletionDoc
        SpeedResult: ../store/schema.js#SpeedResultDoc
        SpeedMark: ../store/schema.js#SpeedMark as SpeedMarkModel
        EventDefinition: ../store/schema.js#EventDefinitionDoc
    plugins:
      - typescript
      - typescript-resolvers
      - add:
          content: |
            import type { ApolloContext } from '../apollo.js'
            import type { Timestamp } from '@google-cloud/firestore'
